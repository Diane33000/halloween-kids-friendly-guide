<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Nos meilleures activités kids friendly pour Halloween.">
    <title>Activités kids friendly pour Halloween</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #4a2a29;
        --panel: #351c1c;
        --accent: #ff9654;
        --olive: #bbb000;
        --text: #fff8f0;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--background);
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        max-width: 1100px;
        margin: auto;
        padding: 1rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.1rem, 3vw, 1.6rem);
        color: var(--olive);
      }

      a.button {
        padding: .75rem 1rem;
        border-radius: 999px;
        background: var(--accent);
        color: var(--panel);
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
      }

      main {
        width: min(100%, 1100px);
        margin: auto;
        padding: 0 1rem 1rem;
      }

      .viewer {
        overflow: hidden;
        width: 100%;
        height: calc(100vh - 92px);
        min-height: 640px;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: 0 20px 60px rgb(0 0 0 / 25%);
      }

      object {
        display: block;
        width: 100%;
        height: 100%;
      }

      .fallback {
        padding: 2rem;
        text-align: center;
      }

      @media (max-width: 640px) {
        header { align-items: flex-start; }
        .viewer {
          height: calc(100vh - 105px);
          min-height: 560px;
          border-radius: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Nos meilleures activités kids friendly pour Halloween</h1>
      <a class="button" href="guide-halloween-kids-friendly.pdf" download>Télécharger le PDF</a>
    </header>
    <main>
      <div class="viewer">
        <object
          data="guide-halloween-kids-friendly.pdf#view=FitH"
          type="application/pdf"
          aria-label="Guide des activités Halloween"
        >
          <div class="fallback">
            <p>Votre navigateur ne peut pas afficher ce PDF directement.</p>
            <a class="button" href="guide-halloween-kids-friendly.pdf">Ouvrir le PDF</a>
          </div>
        </object>
      </div>
    </main>
  </body>
</html>
